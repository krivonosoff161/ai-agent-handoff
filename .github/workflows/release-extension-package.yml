name: Publish harness extension package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact tag produced by the release workflow
        required: true
        type: string
      release_run_id:
        description: Successful tag-triggered release run id
        required: true
        type: string
      target:
        description: Package index target
        required: true
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: extension-package-release-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact attested extension artifacts to ${{ inputs.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify selected tag and source run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          run_json="$RUNNER_TEMP/release-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$run_json"
          python - "$run_json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          expected = {
              "conclusion": "success",
              "event": "push",
              "head_sha": os.environ["GITHUB_SHA"],
              "head_branch": os.environ["RELEASE_TAG"],
              "path": ".github/workflows/release-package.yml",
              "status": "completed",
          }
          observed = {key: run.get(key) for key in expected}
          if observed != expected:
              raise SystemExit(f"source run mismatch: expected={expected}, observed={observed}")
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          name: release-dist-${{ inputs.release_tag }}
          path: dist
      - name: Verify and select the extension artifact closure
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          cd ..
          python tools/verify_release_index.py --dist-dir dist \
            --expected ai-agent-handoff==0.3.0 \
            --expected ai-agent-handoff-harness-extension==1.0.0
          for artifact in dist/*.tar.gz dist/*.whl dist/SHA256SUMS; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-package.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$GITHUB_SHA" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners
          done
          mkdir publish-dist
          cp \
            dist/ai_agent_handoff_harness_extension-1.0.0-py3-none-any.whl \
            dist/ai_agent_handoff_harness_extension-1.0.0.tar.gz \
            publish-dist/
          python tools/verify_release_index.py --dist-dir publish-dist \
            --expected ai-agent-handoff-harness-extension==1.0.0
          if test "${{ inputs.target }}" = "pypi"; then
            python tools/verify_release_index.py --dist-dir publish-dist \
              --expected ai-agent-handoff-harness-extension==1.0.0 \
              --host test.pypi.org --attempts 3 --wait-seconds 10
          fi
      - name: Publish to TestPyPI with OIDC
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          repository-url: https://test.pypi.org/legacy/
          verbose: false
      - name: Publish to PyPI with OIDC
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          verbose: false
      - name: Verify published index hashes
        env:
          TARGET_HOST: ${{ inputs.target == 'testpypi' && 'test.pypi.org' || 'pypi.org' }}
        run: |
          python tools/verify_release_index.py --dist-dir publish-dist \
            --expected ai-agent-handoff-harness-extension==1.0.0 \
            --host "$TARGET_HOST" --attempts 8 --wait-seconds 15

  smoke:
    name: Clean install extension from ${{ inputs.target }} (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install exact extension package from the selected public index
        shell: bash
        env:
          INDEX_URL: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir \
            --index-url "$INDEX_URL" \
            --extra-index-url https://pypi.org/simple/ \
            "ai-agent-handoff-harness-extension==1.0.0"
          python - <<'PY'
          import importlib.metadata as metadata
          assert metadata.version("ai-agent-handoff-harness-extension") == "1.0.0"
          points = metadata.entry_points(group="agentic_security_harness.extensions.v1")
          assert {point.name for point in points} == {"ai-agent-handoff.validation"}
          PY

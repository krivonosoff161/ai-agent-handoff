[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-handoff"
version = "0.2.0"
description = "File-based handoff protocol for AI coding agents + a PreToolUse safety guard."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "krivonosoff161" }]
keywords = ["ai", "agents", "claude", "codex", "hooks", "safety", "handoff", "guardrails", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit>=1.7.10",
    "build>=1.2.2",
    "mypy>=1.11",
    "pytest>=7",
    "ruff>=0.6",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
agent-guard = "agent_guard:main"

[project.urls]
Homepage = "https://github.com/krivonosoff161/ai-agent-handoff"
Changelog = "https://github.com/krivonosoff161/ai-agent-handoff/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-handoff"
version = "0.1.0"
description = "File-based handoff protocol for AI coding agents + a PreToolUse safety guard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "krivonosoff161" }]
keywords = ["ai", "agents", "claude", "codex", "hooks", "safety", "handoff", "vibecoding"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agent-guard = "agent_guard:main"

[project.urls]
Homepage = "https://github.com/krivonosoff161/ai-agent-handoff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
